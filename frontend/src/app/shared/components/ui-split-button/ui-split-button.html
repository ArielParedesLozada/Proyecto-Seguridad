<div class="split-button">
  <app-ui-button [label]="label()" [disabled]="disabled()" (pressed)="primaryAction.emit()" />
  <button
    type="button"
    class="toggle"
    [disabled]="disabled()"
    (click)="open.update((value) => !value)"
    [attr.aria-expanded]="open()"
    aria-label="Más opciones"
  >
    ⌄
  </button>
  @if (open()) {
    <div class="menu">
      @for (option of options(); track option.id) {
        <button type="button" [class.danger]="option.danger" (click)="select(option.id)">
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
