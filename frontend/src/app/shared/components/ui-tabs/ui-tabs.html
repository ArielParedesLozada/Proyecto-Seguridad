<nav class="tabs" aria-label="Archivos abiertos">
  @for (tab of tabs(); track tab.id) {
    <button
      type="button"
      class="tab"
      [class.active]="tab.id === activeId()"
      (click)="selected.emit(tab.id)"
    >
      <span>{{ tab.label }}</span>
      @if (tab.dirty) {
        <i></i>
      }
      <b
        [class.is-disabled]="!canClose(tab)"
        [attr.aria-disabled]="!canClose(tab)"
        (click)="$event.stopPropagation(); requestClose(tab)"
        aria-label="Cerrar pestaña"
      >
        ×
      </b>
    </button>
  }
</nav>
