<aside class="editor-side-panel" [class.is-files]="view() === 'files'" [attr.aria-label]="view() === 'files' ? 'Árbol de archivos' : view() === 'search' ? 'Buscar en el proyecto' : 'Comentarios'">
  @if (view() === 'files') {
    <app-ui-split-pane class="files-outline-split" firstSize="60%" orientation="vertical" [resizable]="true" [firstScrollable]="false" minFirst="8rem" maxFirst="70%" minSecond="8rem">
      <section primary class="panel-section files-section">
        <header class="panel-header"><h2>Árbol de archivos</h2><div class="header-actions" aria-label="Acciones de archivos">
          @if (canEdit()) {
            <app-ui-tooltip text="Nuevo archivo" position="right" [showOnFocus]="false"><button type="button" aria-label="Nuevo archivo" (click)="openFileDialog()"><svg lucideFilePlus2 [size]="17"></svg></button></app-ui-tooltip>
            <app-ui-tooltip text="Nueva carpeta" position="right" [showOnFocus]="false"><button type="button" aria-label="Nueva carpeta" (click)="openFolderDialog()"><svg lucideFolderPlus [size]="17"></svg></button></app-ui-tooltip>
          }
          <app-ui-tooltip text="Cerrar panel" position="right" [showOnFocus]="false"><button type="button" aria-label="Cerrar panel" (click)="closed.emit()"><svg lucideX [size]="17"></svg></button></app-ui-tooltip>
        </div></header>
        @for (entry of flatEntries(); track entry.id) {
          <div class="file-row" [class.is-active]="entry.type === 'FILE' && entry.id === activeFileId()" [style.padding-left.rem]="0.75 + entry.depth">
            <button class="file-row-main" type="button" (click)="selectEntry(entry)">
              @if (entry.type === 'FILE') { <svg lucideFileCode2 [size]="17"></svg> } @else { <svg lucideFolder [size]="17"></svg> }
              <span>{{ entry.name }}</span>
            </button>
            @if (canEdit()) {
              <button type="button" aria-label="Renombrar" (click)="rename(entry)"><svg lucidePencil [size]="14"></svg></button>
              <button type="button" aria-label="Eliminar" (click)="delete(entry)"><svg lucideTrash2 [size]="14"></svg></button>
            }
          </div>
        }
      </section>
      <section secondary class="panel-section outline-section"><header class="panel-header"><h2>Estructura del documento</h2></header><span class="outline-item">Selecciona un archivo Markdown</span></section>
    </app-ui-split-pane>
  } @else if (view() === 'search') {
    <section class="search-section"><header class="panel-header"><h2>Buscar en el proyecto</h2><app-ui-tooltip text="Cerrar panel" position="right" [showOnFocus]="false"><button type="button" aria-label="Cerrar panel" (click)="closed.emit()"><svg lucideX [size]="17"></svg></button></app-ui-tooltip></header>
      <div class="search-form"><app-ui-search-input placeholder="Buscar en el proyecto" (changed)="searchQuery.set($event)"></app-ui-search-input><button class="search-submit" type="button">Buscar</button></div>
      <div class="search-options" aria-label="Opciones de búsqueda"><button type="button" [attr.aria-pressed]="activeSearchOptions().caseSensitive" [class.is-active]="activeSearchOptions().caseSensitive" (click)="toggleSearchOption('caseSensitive')">Aa</button><button type="button" [attr.aria-pressed]="activeSearchOptions().regularExpression" [class.is-active]="activeSearchOptions().regularExpression" (click)="toggleSearchOption('regularExpression')">.*</button><button type="button" [attr.aria-pressed]="activeSearchOptions().wholeWord" [class.is-active]="activeSearchOptions().wholeWord" (click)="toggleSearchOption('wholeWord')">W</button></div>
    </section>
  } @else {
    <app-editor-comments-view [comments]="comments()" [focusRequest]="commentFocusRequest()" (closed)="closed.emit()" (commentAdded)="commentAdded.emit($event)"></app-editor-comments-view>
  }
</aside>

<app-ui-modal title="Nuevo archivo" width="28rem" [visible]="activeModal() === 'file'" (visibleChange)="updateModalVisibility($event, 'file')"><div class="folder-dialog"><app-ui-form-field label="Nombre del archivo"><input type="text" aria-label="Nombre del archivo" [value]="fileName()" (input)="fileName.set($any($event.target).value)" /></app-ui-form-field></div><footer class="dialog-actions"><app-ui-button label="Cancelar" severity="secondary" [outlined]="true" (pressed)="closeModal()"></app-ui-button><app-ui-button label="Crear" (pressed)="createFile()"></app-ui-button></footer></app-ui-modal>
<app-ui-modal title="Nueva carpeta" width="28rem" [visible]="activeModal() === 'folder'" (visibleChange)="updateModalVisibility($event, 'folder')"><div class="folder-dialog"><app-ui-form-field label="Nombre de la carpeta"><input type="text" aria-label="Nombre de la carpeta" [value]="folderName()" (input)="folderName.set($any($event.target).value)" /></app-ui-form-field></div><footer class="dialog-actions"><app-ui-button label="Cancelar" severity="secondary" [outlined]="true" (pressed)="closeModal()"></app-ui-button><app-ui-button label="Crear" (pressed)="createFolder()"></app-ui-button></footer></app-ui-modal>
