<section class="projects-page">
  <header class="workspace-header">
    <div>
      <p class="eyebrow">ESPACIO DE TRABAJO</p>
      <h1>{{ pageTitle }}</h1>
    </div>
  </header>

  <section class="projects-panel" aria-label="Listado de proyectos">
    <div class="project-toolbar">
      <app-ui-search-input
        placeholder="Buscar en todos los proyectos…"
        (changed)="searchTerm.set($event)"
      />
      <button class="primary-action" type="button" (click)="openCreateDialog()">
        <svg lucideFilePlus2 [size]="19"></svg>Nuevo proyecto
      </button>
    </div>
    @if (errorMessage()) {
      <p class="project-error" role="alert">{{ errorMessage() }}</p>
    }
    <app-project-table [projects]="filteredProjects()" (actionSelected)="handleProjectAction($event)" />
  </section>
</section>

<app-ui-modal [(visible)]="createDialogOpen" title="Crear un proyecto" width="28rem">
  <div class="create-project-content">
    <span class="dialog-icon"><svg lucideFilePlus2 [size]="24"></svg></span>
    <div>
      <h2>Empieza con un proyecto nuevo</h2>
      <p>Crea un proyecto vacío para empezar a escribir tu documento.</p>
    </div>
    <app-ui-form-field label="Nombre del proyecto">
      <input [value]="draftName()" maxlength="100" (input)="updateDraftName($event)" />
    </app-ui-form-field>
    <app-ui-modal-actions
      primaryLabel="Crear proyecto"
      [primaryDisabled]="isSaving()"
      (cancelled)="createDialogOpen.set(false)"
      (confirmed)="createProject()"
    />
  </div>
</app-ui-modal>

<app-ui-modal [(visible)]="editDialogOpen" title="Editar proyecto" width="28rem">
  <div class="create-project-content">
    <app-ui-form-field label="Nombre del proyecto">
      <input [value]="draftName()" maxlength="100" (input)="updateDraftName($event)" />
    </app-ui-form-field>
    <app-ui-modal-actions
      primaryLabel="Guardar cambios"
      [primaryDisabled]="isSaving()"
      (cancelled)="editDialogOpen.set(false)"
      (confirmed)="updateProject()"
    />
  </div>
</app-ui-modal>

<app-ui-confirm-dialog
  [(visible)]="deleteDialogOpen"
  title="Archivar proyecto"
  [message]="'El proyecto ' + (selectedProject()?.title ?? '') + ' dejará de aparecer en la lista activa.'"
  confirmLabel="Archivar"
  (confirmed)="confirmArchive()"
/>

<app-ui-modal [(visible)]="shareDialogOpen" title="Compartir proyecto" width="32rem">
  <div class="share-project-content">
    <app-invitation-form
      [isSaving]="isInviting()"
      [errorMessage]="inviteError()"
      (invited)="invite($event)"
    />
    <app-invitation-list
      [invitations]="invitations()"
      (revokeRequested)="revokeInvitation($event)"
      (resendRequested)="resendInvitation($event)"
    />
  </div>
</app-ui-modal>
