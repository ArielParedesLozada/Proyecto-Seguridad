<section class="projects-page">
  <header class="workspace-header">
    <div>
      <p class="eyebrow">ESPACIO DE TRABAJO</p>
      <h1>{{ pageTitle }}</h1>
    </div>
  </header>

  <section class="projects-panel" aria-label="Listado de proyectos">
    <div class="project-toolbar">
      <app-ui-search-input
        placeholder="Buscar en todos los proyectos…"
        (changed)="searchTerm.set($event)"
      />
      <button class="primary-action" type="button" (click)="createDialogOpen.set(true)">
        <svg lucideFilePlus2 [size]="19"></svg>Nuevo proyecto
      </button>
    </div>
    <app-project-table [projects]="filteredProjects()" />
  </section>
</section>

<app-ui-modal [(visible)]="createDialogOpen" title="Crear un proyecto" width="28rem">
  <div class="create-project-content">
    <span class="dialog-icon"><svg lucideFilePlus2 [size]="24"></svg></span>
    <div>
      <h2>Empieza con un proyecto nuevo</h2>
      <p>En el siguiente paso podrás elegir una plantilla o crear un documento vacío.</p>
    </div>
    <app-ui-modal-actions
      primaryLabel="Continuar"
      (cancelled)="createDialogOpen.set(false)"
      (confirmed)="createDialogOpen.set(false)"
    />
  </div>
</app-ui-modal>
