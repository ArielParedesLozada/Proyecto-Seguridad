<td class="select-cell">
  <input
    type="checkbox"
    [attr.aria-label]="'Seleccionar ' + project().title"
    [checked]="selected()"
    (change)="selectionChanged.emit($any($event.target).checked)"
  />
</td>
<td class="title-cell">
  <span class="document-icon"><svg lucideFileText [size]="19"></svg></span>
  <a class="project-link" [routerLink]="['/editor', project().id]">
    <strong>{{ project().title }}</strong>
  </a>
</td>
<td class="owner-cell">
  <span class="avatar">{{ project().ownerInitials }}</span
  >{{ project().owner }}
</td>
<td class="updated-cell">{{ project().updatedAt }}</td>
<td class="actions-cell">
  <app-project-action-menu
    [projectTitle]="project().title"
    [canManage]="project().role === 'OWNER'"
    (actionSelected)="actionSelected.emit($event)"
  />
</td>
