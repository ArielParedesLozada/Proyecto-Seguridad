<div
  class="application-shell"
  [class.sidebar-collapsed]="!sidebarOpen()"
  [class.mobile-sidebar-open]="mobileMenuOpen()"
>
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Cerrar navegación"
    (click)="closeMobileMenu()"
  ></button>
  <aside class="sidebar" aria-label="Navegación principal">
    <button
      class="mobile-close"
      type="button"
      aria-label="Cerrar navegación"
      (click)="closeMobileMenu()"
    >
      <svg lucideX [size]="21"></svg>
    </button>
    <app-ui-brand-logo
      link="/projects"
      ariaLabel="ChiperTex, ir a proyectos"
      (click)="closeMobileMenu()"
    />

    <nav class="navigation">
      <app-ui-tooltip text="Proyectos" position="right" [disabled]="sidebarOpen()">
        <a
          class="section-link"
          routerLink="/projects"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
        >
          <svg lucideFolderOpen [size]="20"></svg><span>Proyectos</span>
        </a>
      </app-ui-tooltip>
      <div class="project-links">
        <a routerLink="/projects/my-projects" routerLinkActive="active" (click)="closeMobileMenu()"
          >Mis proyectos</a
        >
        <a routerLink="/projects/shared" routerLinkActive="active" (click)="closeMobileMenu()"
          >Compartidos conmigo</a
        >
        <a routerLink="/projects/archived" routerLinkActive="active" (click)="closeMobileMenu()"
          >Archivados</a
        >
      </div>
      <app-ui-tooltip text="Plantillas" position="right" [disabled]="sidebarOpen()"
        ><a class="section-link" routerLink="/projects/templates" (click)="closeMobileMenu()"
          ><svg lucideFiles [size]="20"></svg><span>Plantillas</span></a
        ></app-ui-tooltip
      >
      <app-ui-tooltip text="Papelera" position="right" [disabled]="sidebarOpen()"
        ><a class="section-link" routerLink="/projects/trash" (click)="closeMobileMenu()"
          ><svg lucideTrash2 [size]="20"></svg><span>Papelera</span></a
        ></app-ui-tooltip
      >
    </nav>

    <app-ui-tooltip
      class="settings-tooltip"
      text="Configuración"
      position="right"
      [disabled]="sidebarOpen()"
    >
      <button
        class="settings-link section-link"
        type="button"
        [attr.aria-expanded]="settingsMenuOpen()"
        aria-controls="settings-menu"
        (click)="toggleSettingsMenu()"
      >
        <svg lucideSettings [size]="20"></svg><span>Configuración</span>
      </button>
    </app-ui-tooltip>
    @if (settingsMenuOpen()) {
      <section id="settings-menu" class="settings-menu" aria-label="Configuración rápida">
        <button class="menu-action" type="button" (click)="theme.toggle()">
          @if (theme.darkMode()) {
            <svg lucideSun [size]="18"></svg><span>Tema claro</span>
          } @else {
            <svg lucideMoon [size]="18"></svg><span>Tema oscuro</span>
          }
        </button>
        <button class="menu-action logout-action" type="button" (click)="logout()">
          <svg lucideLogOut [size]="18"></svg><span>Cerrar sesión</span>
        </button>
      </section>
    }
  </aside>

  <div class="content-shell">
    <header class="topbar">
      <button
        class="icon-control"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Mostrar u ocultar navegación"
      >
        @if (sidebarOpen()) {
          <svg lucideMenu [size]="23"></svg>
        } @else {
          <svg lucideChevronLeft [size]="23"></svg>
        }
      </button>
      <div class="topbar-actions">
        <div class="profile-wrapper">
          <button
            class="profile"
            type="button"
            aria-label="Abrir menú de Diego"
            [attr.aria-expanded]="profileMenuOpen()"
            aria-controls="profile-menu"
            (click)="toggleProfileMenu()"
          >
            <span>DS</span><strong>Diego</strong>
          </button>
          @if (profileMenuOpen()) {
            <section id="profile-menu" class="profile-menu" aria-label="Menú de usuario">
              <button class="menu-action logout-action" type="button" (click)="logout()">
                <svg lucideLogOut [size]="18"></svg><span>Cerrar sesión</span>
              </button>
            </section>
          }
        </div>
      </div>
    </header>
    <main class="page-content"><router-outlet /></main>
    <app-ui-footer productName="ChiperTex" />
  </div>
</div>
